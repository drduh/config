# https://github.com/drduh/config/blob/main/dnsmasq.conf
# https://thekelleys.org.uk/dnsmasq/docs/dnsmasq-man.html

listen-address=127.0.0.1
#listen-address=127.0.0.1,10.19.18.1,10.127.0.97,172.31.255.225

# DHCP server options
#dhcp-range=10.19.18.2,10.19.18.30,20h
#dhcp-range=10.127.0.98,10.127.0.126,20h
#dhcp-range=172.31.255.226,172.31.255.254,20h
#dhcp-option=option:router,10.19.18.1
#dhcp-option=option:ntp-server,10.19.18.1
#dhcp-script=/etc/dnsmasq-dhcp.sh

# Only use upstream servers
no-poll
no-resolv

# Resolution options
bogus-priv
cache-size=2000
domain-needed
rebind-localhost-ok
stop-dns-rebind
filterwin2k # Block SOA and SRV

# Logging
log-async=5
log-facility=/var/log/dnsmasq
log-dhcp
log-queries

# Additional hosts to block
#addn-hosts=/etc/dns-blocklist

# Block all
#address=/#/#          # block all queries
#address=/#/127.0.0.1  # block A queries
#address=/#/::         # block AAAA queries

# Local network resolver
#server=192.168.1.1
# Localhost dnscrypt
#server=127.0.0.1#5300
# Localhost unbound
#server=127.0.0.1#5335

